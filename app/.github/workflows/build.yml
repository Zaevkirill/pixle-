name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: for f in *.zip; do unzip -q -o "$f"; done

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        working-directory: PixelLauncher
        run: gradle assembleDebug --no-daemon

      - name: Build release APK
        working-directory: PixelLauncher
        continue-on-error: true
        run: gradle assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: PixelLauncher-apk
          path: |
            PixelLauncher/app/build/outputs/apk/debug/app-debug.apk
            PixelLauncher/app/build/outputs/apk/release/app-release.apk
