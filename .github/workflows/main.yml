name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fix file paths
        run: |
          D=app/src/main
          mkdir -p $D/java/com/example/pixellauncher $D/res/values $D/res/drawable $D/res/mipmap-anydpi-v26
          if [ -d app/.github ]; then
            find app/.github -type f | while read -r f; do
              b=$(basename "$f")
              p=$(dirname "$f")
              case "$b" in
                *.kt) mv -n "$f" $D/java/com/example/pixellauncher/ ;;
                *)
                  case "$p" in
                    */res/values) mv -n "$f" $D/res/values/ ;;
                    */res/drawable) mv -n "$f" $D/res/drawable/ ;;
                    */res/mipmap-anydpi-v26) mv -n "$f" $D/res/mipmap-anydpi-v26/ ;;
                  esac ;;
              esac
            done
            rm -rf app/.github
          fi
          find app -type f | sort

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          packages: ''

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: PixelLauncher-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
